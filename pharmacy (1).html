<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pharmacy dashboard</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#14201b;--mu:#5d6b64;--ac:#0f766e;--bd:#d9e1dd;--bad:#b42318;--hero:#e6f4f1}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#16201b;--tx:#e8f0ec;--mu:#9baba3;--ac:#2dd4bf;--bd:#2a3a33;--bad:#f97066;--hero:#12231e}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:0 auto;padding:14px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px}.top img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--hero)}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.d{background:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}nav button{background:transparent;color:var(--tx);border:1px solid var(--bd)}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}.row:first-child{border-top:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{font-size:22px;font-weight:700}
.line{display:grid;grid-template-columns:3fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--hero);color:var(--ac);font-weight:600}
.msg{padding:9px;border-radius:8px;margin-bottom:10px}.ok{background:#d1fadf;color:#05603a}.er{background:#fee4e2;color:#912018}
</style>
</head>
<body>
<main>
<div id="msg"></div>
<div id="gate" class="card" hidden><h2>Sign in</h2><p class="mu">Use the email and password of your account. No email is sent when you sign in.</p><input id="le" type="email" placeholder="Email" autocomplete="username"><div style="height:6px"></div><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button id="lg" style="margin-top:8px">Sign in</button></div>
<div id="none" class="card" hidden>No pharmacy found on this account. <a href="onboard.html?type=pharmacy">Apply here</a>.</div>
<div id="pend" class="card" hidden>Your pharmacy application is still under review. You will get access here once it is approved.</div>
<div id="app" hidden>
  <div class="top"><img id="logo" alt=""><div><h1 id="pname"></h1><div class="mu" id="ploc"></div></div></div>
  <nav id="tabs"></nav>
  <div id="v"></div>
</div>
</main>
<datalist id="plist"></datalist>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const naira = n => "₦" + Number(n || 0).toLocaleString();
function say(t, ok) { $("msg").innerHTML = t ? `<div class="msg ${ok ? "ok" : "er"}">${esc(t)}</div>` : ""; if (t) window.scrollTo(0, 0); }
let db, uid, ph, PRODUCTS = {};
const BANKS = [["Access Bank","044"],["First Bank","011"],["GTBank","058"],["UBA","033"],["Zenith Bank","057"],["Fidelity Bank","070"],["Union Bank","032"],["Sterling Bank","232"],["Stanbic IBTC","221"],["Wema Bank","035"],["Polaris Bank","076"],["FCMB","214"]];
const STATUS = { awaiting_quote: "Needs your bill", quoted: "Bill sent, awaiting payment", paid: "Paid: please prepare", preparing: "Preparing", out_for_delivery: "Out for delivery", delivered: "Delivered", cancelled: "Cancelled", refunded: "Refunded" };

async function signIn() {
  const { error } = await db.auth.signInWithPassword({ email: $("le").value.trim(), password: $("lp").value });
  if (error) return say(error.message);
  location.reload();
}
async function boot() {
  try {
    if (typeof HCH === "undefined") throw new Error("config.js did not load.");
    db = supabase.createClient(HCH.url.trim().replace(/\/+$/, ""), HCH.key.trim());
  } catch (e) { return say(e.message); }
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("gate").hidden = false; $("lg").onclick = signIn; $("lp").onkeydown = e => { if (e.key === "Enter") signIn(); }; return; }
  uid = session.user.id;
  const { data } = await db.from("pharmacies").select("*").eq("owner_id", uid).maybeSingle();
  if (!data) return $("none").hidden = false;
  if (data.status !== "approved") return $("pend").hidden = false;
  ph = data; $("app").hidden = false;
  $("pname").textContent = ph.name; $("ploc").textContent = [ph.city, ph.state].filter(Boolean).join(", ");
  if (ph.logo_path) $("logo").src = db.storage.from("brand-assets").getPublicUrl(ph.logo_path).data.publicUrl; else $("logo").hidden = true;
  $("tabs").innerHTML = [["orders","Orders"],["products","Products"],["earnings","Earnings"],["bank","Bank details"]].map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("");
  $("tabs").onclick = e => e.target.dataset.k && show(e.target.dataset.k);
  await loadProducts(true); show("orders");
  setInterval(() => { if ($("tabs").querySelector(".on")?.dataset.k === "orders" && !document.activeElement.closest?.(".bill")) loadOrders(); }, 45000);
}
function show(k) { [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.k === k)); say(""); ({ orders: loadOrders, products: renderProducts, earnings: loadEarnings, bank: loadBank })[k](); }

// ---------- PRODUCTS ----------
let PLIST = [];
async function loadProducts(quiet) {
  const { data } = await db.from("pharmacy_items").select("*").eq("pharmacy_id", ph.id).order("name");
  PLIST = data || []; PRODUCTS = {}; PLIST.forEach(p => PRODUCTS[p.name.toLowerCase()] = p.price);
  $("plist").innerHTML = PLIST.map(p => `<option value="${esc(p.name)}">`).join("");
  if (!quiet) renderProducts();
}
function renderProducts() {
  $("v").innerHTML = `<div class="card"><h2>Add a product</h2>
    <input id="pn" placeholder="Drug name"><div style="height:6px"></div>
    <div class="g"><input id="ps" placeholder="Strength (e.g. 500mg)"><input id="pf" placeholder="Form (tablet, syrup...)"><input id="pp" type="number" min="0" step="10" placeholder="Price ₦"></div>
    <label class="mu"><input type="checkbox" id="prx" checked style="width:auto"> Needs a prescription</label><br>
    <button id="padd" style="margin-top:8px">Add product</button></div>
    <div class="card"><h2>Your products (${PLIST.length})</h2>${PLIST.map(p => `<div class="row"><div><b>${esc(p.name)}</b> <span class="mu">${esc(p.strength || "")} ${esc(p.form || "")}</span>
    <div class="mu">${naira(p.price)} · ${p.in_stock ? "In stock" : "Out of stock"}${p.requires_prescription ? " · Rx" : ""}</div></div>
    <div><button class="s" data-stock="${esc(p.id)}" data-to="${!p.in_stock}">${p.in_stock ? "Mark out of stock" : "Mark in stock"}</button>
    <button class="s" data-price="${esc(p.id)}">Price</button> <button class="d" data-del="${esc(p.id)}">Delete</button></div></div>`).join("") || "<div class='mu'>No products yet.</div>"}</div>`;
}
async function productClick(t) {
  if (t.id === "padd") {
    const name = $("pn").value.trim(), price = Number($("pp").value);
    if (!name || !(price >= 0) || $("pp").value === "") return say("Enter a drug name and price.");
    const { error } = await db.from("pharmacy_items").insert({ pharmacy_id: ph.id, name, strength: $("ps").value.trim() || null, form: $("pf").value.trim() || null, price, requires_prescription: $("prx").checked });
    if (error) return say(error.message); say("Product added.", true); await loadProducts();
  } else if (t.dataset.stock) { const { error } = await db.from("pharmacy_items").update({ in_stock: t.dataset.to === "true" }).eq("id", t.dataset.stock); if (error) return say(error.message); await loadProducts();
  } else if (t.dataset.price) { const v = prompt("New price in ₦:"); if (v === null) return; const n = Number(v); if (!(n >= 0) || v.trim() === "") return say("Enter a valid price.");
    const { error } = await db.from("pharmacy_items").update({ price: n }).eq("id", t.dataset.price); if (error) return say(error.message); await loadProducts();
  } else if (t.dataset.del && confirm("Delete this product?")) { const { error } = await db.from("pharmacy_items").delete().eq("id", t.dataset.del); if (error) return say(error.message); await loadProducts(); }
}

// ---------- ORDERS ----------
const lineHtml = (n = "", q = 1, p = "") => `<div class="line"><input class="dn" list="plist" placeholder="Drug" value="${esc(n)}"><input class="dq" type="number" min="1" value="${esc(q)}"><input class="dp" type="number" min="0" step="10" placeholder="Unit ₦" value="${esc(p)}"><button class="d" data-rm>✕</button></div>`;
async function loadOrders() {
  const { data: os, error } = await db.from("orders").select("id,patient_id,status,fulfilment,subtotal,delivery_fee,total,created_at,prescription_id,address_id").eq("pharmacy_id", ph.id).order("created_at", { ascending: false }).limit(50);
  if (error) return say(error.message);
  if (!os.length) { $("v").innerHTML = `<div class="card mu">No orders yet. When a patient sends you a prescription, it appears here.</div>`; return; }
  const ids = os.map(o => o.id), rxs = [...new Set(os.map(o => o.prescription_id))], pats = [...new Set(os.map(o => o.patient_id))], ads = os.map(o => o.address_id).filter(Boolean);
  const [ri, oi, ad, pr] = await Promise.all([
    db.from("prescription_items").select("prescription_id,drug_name,strength,dosage_instructions,quantity").in("prescription_id", rxs),
    db.from("order_items").select("order_id,drug_name,quantity,unit_price").in("order_id", ids),
    ads.length ? db.from("addresses").select("id,address_text").in("id", ads) : Promise.resolve({ data: [] }),
    db.from("profiles").select("id,display_name,phone").in("id", pats)]);
  const by = (arr, k) => (arr || []).reduce((m, x) => ((m[x[k]] = m[x[k]] || []).push(x), m), {});
  const R = by(ri.data, "prescription_id"), I = by(oi.data, "order_id"), A = Object.fromEntries((ad.data || []).map(a => [a.id, a.address_text])), P = Object.fromEntries((pr.data || []).map(p => [p.id, p]));
  $("v").innerHTML = os.map(o => {
    const rx = R[o.prescription_id] || [], items = I[o.id] || [], pat = P[o.patient_id], billable = ["awaiting_quote", "quoted"].includes(o.status);
    const act = o.status === "paid" ? `<button data-act="preparing" data-id="${o.id}">Start preparing</button>`
      : o.status === "preparing" ? (o.fulfilment === "delivery" ? `<button data-act="out_for_delivery" data-id="${o.id}">Out for delivery</button> ` : "") + `<button class="s" data-act="delivered" data-id="${o.id}">${o.fulfilment === "pickup" ? "Picked up" : "Delivered"}</button>`
      : o.status === "out_for_delivery" ? `<button data-act="delivered" data-id="${o.id}">Mark delivered</button>` : "";
    return `<div class="card"><div class="row" style="border:0;padding:0"><b>Order ${esc(o.id.slice(0, 8))}</b><span class="badge">${STATUS[o.status] || esc(o.status)}</span></div>
    <div class="mu">${new Date(o.created_at).toLocaleString()} · ${o.fulfilment === "delivery" ? "Delivery" : "Pickup"}</div>
    ${pat ? `<div class="mu">Patient: ${esc(pat.display_name)} ${pat.phone ? "· " + esc(pat.phone) : ""}${A[o.address_id] ? "<br>Address: " + esc(A[o.address_id]) : ""}</div>` : ""}
    <h2 style="margin-top:10px">Prescription</h2>${rx.map(x => `<div class="mu">• ${esc(x.drug_name)} ${esc(x.strength || "")} × ${esc(x.quantity)} — ${esc(x.dosage_instructions)}</div>`).join("") || "<div class='mu'>None attached.</div>"}
    ${billable ? `<h2 style="margin-top:10px">Bill</h2><div class="bill" data-id="${o.id}"><div class="lines">${(items.length ? items : rx.map(x => ({ drug_name: x.drug_name, quantity: x.quantity, unit_price: PRODUCTS[(x.drug_name || "").toLowerCase()] ?? "" }))).map(i => lineHtml(i.drug_name, i.quantity, i.unit_price)).join("")}</div>
      <button class="s" data-add>+ item</button> ${o.fulfilment === "delivery" ? `<label class="mu">Delivery fee ₦ <input class="dfee" type="number" min="0" value="${esc(ph.delivery_fee || 0)}" style="width:110px"></label>` : ""}
      <button data-send style="margin-left:6px">${o.status === "quoted" ? "Update bill" : "Send bill"}</button></div>`
      : `<div class="mu" style="margin-top:6px">${items.map(i => esc(i.drug_name) + " × " + i.quantity + " @ " + naira(i.unit_price)).join("<br>")}<br><b>Total ${naira(o.total)}</b> (incl. delivery ${naira(o.delivery_fee)})</div>`}
    <div style="margin-top:8px">${act}</div></div>`;
  }).join("");
}
async function sendBill(card) {
  const oid = card.dataset.id;
  const rows = [...card.querySelectorAll(".line")].map(l => ({ order_id: oid, drug_name: l.querySelector(".dn").value.trim(), quantity: parseInt(l.querySelector(".dq").value) || 0, unit_price: Number(l.querySelector(".dp").value) }));
  if (!rows.length || rows.some(r => !r.drug_name || r.quantity < 1 || !(r.unit_price >= 0) || isNaN(r.unit_price))) return say("Fill in the drug, quantity and price on every line.");
  await db.from("order_items").delete().eq("order_id", oid);
  const ins = await db.from("order_items").insert(rows); if (ins.error) return say(ins.error.message);
  const q = await db.rpc("quote_order", { p_id: oid, p_delivery_fee: Number(card.querySelector(".dfee")?.value) || 0 });
  if (q.error) return say(q.error.message); say("Bill sent to the patient.", true); loadOrders();
}

// ---------- EARNINGS ----------
async function loadEarnings() {
  const [s, w, p] = await Promise.all([db.rpc("my_wallet_summary"), db.from("wallet_entries").select("amount,status,note,created_at").order("created_at", { ascending: false }).limit(20),
    db.from("payouts").select("amount,status,created_at").order("created_at", { ascending: false }).limit(10)]);
  const x = (s.data && s.data[0]) || {};
  $("v").innerHTML = `<div class="g"><div class="card"><div class="mu">Available</div><div class="stat">${naira(x.available)}</div></div>
    <div class="card"><div class="mu">Pending (released on delivery)</div><div class="stat">${naira(x.pending)}</div></div>
    <div class="card"><div class="mu">Paid out</div><div class="stat">${naira(x.paid_out)}</div></div></div>
    <div class="card"><button id="wd">Withdraw available balance</button><div class="mu" style="margin-top:6px">Available balances are also queued automatically every day at 23:59. Save your bank details first.</div></div>
    <div class="card"><h2>Recent sales</h2>${(w.data || []).map(e => `<div class="row"><span>${esc(e.note || "Sale")} <span class="mu">${new Date(e.created_at).toLocaleDateString()}</span></span><span>${naira(e.amount)} <span class="badge">${esc(e.status)}</span></span></div>`).join("") || "<div class='mu'>No sales yet.</div>"}</div>
    <div class="card"><h2>Payouts</h2>${(p.data || []).map(e => `<div class="row"><span>${new Date(e.created_at).toLocaleDateString()}</span><span>${naira(e.amount)} <span class="badge">${esc(e.status)}</span></span></div>`).join("") || "<div class='mu'>None yet.</div>"}</div>`;
}

// ---------- BANK ----------
async function loadBank() {
  const { data: b } = await db.from("bank_accounts").select("bank_name,bank_code,account_number,account_name").eq("owner_id", uid).maybeSingle();
  $("v").innerHTML = `<div class="card"><h2>Payout account</h2><p class="mu">Your daily earnings are paid here. The account name must match your pharmacy or your name.</p>
    <select id="bk">${BANKS.map(([n, c]) => `<option value="${c}" ${b && b.bank_code === c ? "selected" : ""}>${n}</option>`).join("")}</select><div style="height:6px"></div>
    <input id="an" inputmode="numeric" maxlength="10" placeholder="10-digit account number" value="${esc(b?.account_number || "")}"><div style="height:6px"></div>
    <input id="ac" placeholder="Account name" value="${esc(b?.account_name || "")}"><br><button id="bsave" style="margin-top:8px">Save bank details</button></div>`;
  $("v").dataset.has = b ? "1" : "";
}
async function saveBank() {
  const sel = $("bk"), row = { bank_name: sel.options[sel.selectedIndex].text, bank_code: sel.value, account_number: $("an").value.trim(), account_name: $("ac").value.trim() };
  if (!/^\d{10}$/.test(row.account_number) || !row.account_name) return say("Enter a 10-digit account number and the account name.");
  const r = $("v").dataset.has ? await db.from("bank_accounts").update(row).eq("owner_id", uid) : await db.from("bank_accounts").insert({ owner_id: uid, ...row });
  if (r.error) return say(r.error.message); $("v").dataset.has = "1"; say("Bank details saved.", true);
}

// ---------- events ----------
$("v").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "wd") { const r = await db.rpc("request_withdrawal"); return r.error ? say(r.error.message) : (say("Withdrawal queued.", true), loadEarnings()); }
  if (t.id === "bsave") return saveBank();
  if (t.dataset.act) { const r = await db.rpc("set_order_status", { p_id: t.dataset.id, p_status: t.dataset.act }); return r.error ? say(r.error.message) : loadOrders(); }
  const bill = t.closest(".bill");
  if (t.dataset.add !== undefined && bill) return bill.querySelector(".lines").insertAdjacentHTML("beforeend", lineHtml());
  if (t.dataset.rm !== undefined) return t.closest(".line").remove();
  if (t.dataset.send !== undefined && bill) return sendBill(bill);
  productClick(t);
});
$("v").addEventListener("change", e => { if (e.target.classList.contains("dn")) { const p = PRODUCTS[e.target.value.trim().toLowerCase()], pr = e.target.closest(".line").querySelector(".dp"); if (p !== undefined && !pr.value) pr.value = p; } });
boot();
</script>
</body>
</html>
