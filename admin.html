<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HCH Admin</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#14201b;--mu:#5d6b64;--ac:#0f766e;--bd:#d9e1dd;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#16201b;--tx:#e8f0ec;--mu:#9baba3;--ac:#2dd4bf;--bd:#2a3a33;--bad:#f97066}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%;margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;width:auto;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.bad{background:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}nav button{background:transparent;color:var(--tx);border:1px solid var(--bd)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-child{border-top:0}.mu{color:var(--mu);font-size:13px}.msg{padding:8px;border-radius:8px;margin-bottom:10px;font-size:14px}
.ok{background:#d1fadf;color:#05603a}.er{background:#fee4e2;color:#912018}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
.stat{font-size:22px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>HCH Workforce — Admin</h1>
<div id="msg"></div>
<div id="login" class="card" hidden>
  <h2>Sign in (admin account)</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
</div>
<div id="app" hidden>
  <nav id="tabs"></nav>
  <section id="t-overview"></section>
  <section id="t-courses" hidden></section>
  <section id="t-lessons" hidden></section>
  <section id="t-approvals" hidden></section>
  <section id="t-money" hidden></section>
  <button class="sec" id="out">Sign out</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== PUT YOUR VALUES HERE (anon/publishable key ONLY, never service_role) ======
const SUPABASE_URL = "https://vnocplsafzgzucixeswi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uA5yLqZx1TmZQkkWhXrUrw_yECndg_d";
// ==================================================================================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const naira = n => "₦" + Number(n || 0).toLocaleString();
function say(t, ok) { $("msg").innerHTML = t ? `<div class="msg ${ok ? "ok" : "er"}">${esc(t)}</div>` : ""; }
async function run(p, okText) { const { data, error } = await p; if (error) { say(error.message, false); return null; } if (okText) say(okText, true); return data ?? true; }

const TABS = [["overview","Overview"],["courses","Courses"],["lessons","Lessons"],["approvals","Approvals"],["money","Earnings"]];
function showTab(k) {
  TABS.forEach(([id]) => $("t-" + id).hidden = id !== k);
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.k === k));
  ({ overview: loadOverview, courses: loadCourses, lessons: loadLessons, approvals: loadApprovals, money: loadMoney })[k]();
}
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("login").hidden = false; $("app").hidden = true; return; }
  const { data: me } = await db.from("profiles").select("role").eq("id", session.user.id).single();
  if (!me || me.role !== "admin") { say("This account is not an admin.", false); await db.auth.signOut(); $("login").hidden = false; return; }
  $("login").hidden = true; $("app").hidden = false;
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("");
  $("tabs").onclick = e => e.target.dataset.k && showTab(e.target.dataset.k);
  showTab("overview");
}
$("go").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) return say(error.message, false); say(""); boot();
};
$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };

// ---------- OVERVIEW ----------
async function loadOverview() {
  const { data: d, error } = await db.rpc("admin_overview");
  if (error) return say(error.message + " (run SQL Block 7 first)", false);
  const n = v => Number(v || 0).toLocaleString();
  const box = (l, v, s = "") => `<div class="card"><div class="mu">${l}</div><div class="stat">${v}</div><div class="mu">${s}</div></div>`;
  const p = d.people, m = d.matching, e = d.earnings, w = d.wallets, L = d.learning;
  const total = Object.values(e).reduce((a, x) => a + Number(x.commission || 0), 0);
  const names = { consultations: "Consultations (1% commission)", pharmacy: "Pharmacy orders (1% commission)", lab: "Lab orders (1% commission)", courses: "Course sales (100%)", subscriptions: "Subscriptions (100%)", placements: "Placement fees (100%)" };
  $("t-overview").innerHTML =
    `<div class="card"><div class="mu">Total platform earnings</div><div class="stat">${naira(total)}</div></div>
    <div class="card"><h2>Earnings by feature</h2>${Object.keys(names).map(k => `<div class="row"><b>${names[k]}</b>
      <span class="mu">${n(e[k].count)} paid · Sales ${naira(e[k].gross)} · You earn ${naira(e[k].commission)}</span></div>`).join("")}</div>
    <h2>People</h2><div class="grid">
    ${box("Students", n(p.students))}${box("Professionals", n(p.professionals))}
    ${box("Organizations", n(p.organizations))}${box("Patients", n(p.patients))}
    ${box("Doctors", n(p.doctors_approved), n(p.doctors_pending) + " awaiting approval")}
    ${box("Pharmacies", n(p.pharmacies_approved), n(p.pharmacies_pending) + " awaiting approval")}
    ${box("Laboratories", n(p.labs_approved), n(p.labs_pending) + " awaiting approval")}</div>
    <h2>Activity</h2><div class="grid">
    ${box("Consultations", n(d.activity.consultations_paid), n(d.activity.consultations_done) + " completed")}
    ${box("Drug orders", n(d.activity.orders_paid), n(d.activity.orders_delivered) + " delivered")}
    ${box("Lab orders", n(d.activity.lab_paid), n(d.activity.lab_done) + " results ready")}
    ${box("Job matching", n(m.accepted) + " matches", n(m.applications) + " applications · " + n(m.open_opportunities) + " open opportunities")}</div>
    <h2>Money held for providers</h2><div class="grid">
    ${box("Pending", naira(w.pending), "released on delivery / completion")}${box("Available", naira(w.available), "paid out at 23:59")}
    ${box("Paid out", naira(w.paid_out))}</div>
    <div class="card"><h2>Student progress by course</h2>${(L.courses || []).map(c => {
      const pct = c.enrolled > 0 && c.lessons > 0 ? Math.round(100 * c.lessons_done / (c.enrolled * c.lessons)) : 0;
      return `<div class="row"><b>${esc(c.title)}</b><span class="mu">${n(c.enrolled)} enrolled · ${n(c.completed)} completed · ${pct}% average progress</span></div>`;
    }).join("") || "<div class='mu'>No courses yet.</div>"}
    <div class="mu" style="margin-top:8px">Total enrollments: ${n(L.enrollments)}</div></div>`;
}

// ---------- COURSES ----------
async function loadCourses() {
  const { data } = await db.from("courses").select("*").order("created_at", { ascending: false });
  $("t-courses").innerHTML = `<div class="card"><h2>Add a course</h2>
    <input id="c-title" placeholder="Title"><input id="c-slug" placeholder="slug-like-this">
    <textarea id="c-desc" placeholder="Description" rows="3"></textarea>
    <div class="grid"><select id="c-level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
    <input id="c-price" type="number" min="0" step="100" placeholder="Price in ₦ (0 = free)" value="0"></div>
    <button id="c-add">Create course (unpublished)</button></div>
    <div class="card"><h2>All courses</h2>${(data || []).map(c => `<div class="row"><div><b>${esc(c.title)}</b>
    <div class="mu">${esc(c.level)} · ${c.price_ngn > 0 ? naira(c.price_ngn) : "Free"} · ${c.published ? "Published" : "Draft"}</div></div>
    <button class="sec" data-pub="${esc(c.id)}" data-to="${!c.published}">${c.published ? "Unpublish" : "Publish"}</button></div>`).join("") || "<div class='mu'>No courses yet.</div>"}</div>`;
  $("c-add").onclick = async () => {
    const t = $("c-title").value.trim(), s = $("c-slug").value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-");
    if (!t || !s) return say("Title and slug are required.", false);
    if (await run(db.from("courses").insert({ title: t, slug: s, description: $("c-desc").value, level: $("c-level").value, price_ngn: Number($("c-price").value) || 0, published: false }), "Course created.")) loadCourses();
  };
  $("t-courses").onclick = async e => { const id = e.target.dataset.pub; if (!id) return;
    if (await run(db.from("courses").update({ published: e.target.dataset.to === "true" }).eq("id", id), "Updated.")) loadCourses(); };
}

// ---------- LESSONS ----------
async function loadLessons() {
  const { data: cs } = await db.from("courses").select("id,title").order("title");
  $("t-lessons").innerHTML = `<div class="card"><h2>Add a lesson</h2><select id="l-course">${(cs || []).map(c => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join("")}</select>
    <input id="l-title" placeholder="Lesson title"><textarea id="l-content" rows="5" placeholder="Lesson text"></textarea>
    <input id="l-video" placeholder="Video link (optional)"><input id="l-pos" type="number" placeholder="Order number" value="1">
    <button id="l-add">Add lesson</button></div><div class="card" id="l-list"></div>`;
  const list = async () => { const cid = $("l-course").value; if (!cid) return;
    const { data } = await db.from("lessons").select("id,title,position").eq("course_id", cid).order("position");
    $("l-list").innerHTML = "<h2>Lessons in this course</h2>" + ((data || []).map(l => `<div class="row"><span>${l.position}. ${esc(l.title)}</span>
    <button class="bad" data-del="${esc(l.id)}">Delete</button></div>`).join("") || "<div class='mu'>None yet.</div>"); };
  $("l-course").onchange = list; list();
  $("l-add").onclick = async () => { const t = $("l-title").value.trim(); if (!t) return say("Lesson title required.", false);
    if (await run(db.from("lessons").insert({ course_id: $("l-course").value, title: t, content: $("l-content").value, video_url: $("l-video").value || null, position: Number($("l-pos").value) || 0 }), "Lesson added.")) { $("l-title").value = ""; list(); } };
  $("l-list").onclick = async e => { const id = e.target.dataset.del; if (id && confirm("Delete this lesson?")) { if (await run(db.from("lessons").delete().eq("id", id), "Deleted.")) list(); } };
}

// ---------- APPROVALS ----------
async function loadApprovals() {
  const [d, p, l, v] = await Promise.all([
    db.from("doctor_profiles").select("user_id,specialty,licence_number").eq("approved", false),
    db.from("pharmacies").select("id,name,pcn_licence,address_text").eq("status", "pending"),
    db.from("laboratories").select("id,name,mlscn_licence,address_text").eq("status", "pending"),
    db.from("verification_requests").select("id,user_id,document_path,notes").eq("status", "pending")]);
  const btn = (kind, id, extra = "") => `<button data-k="${kind}" data-id="${esc(id)}" ${extra} data-ok="1">Approve</button> <button class="bad" data-k="${kind}" data-id="${esc(id)}" ${extra} data-ok="0">Reject</button>`;
  const sec = (title, rows) => `<div class="card"><h2>${title}</h2>${rows.join("") || "<div class='mu'>Nothing pending.</div>"}</div>`;
  $("t-approvals").innerHTML =
    sec("Doctors", (d.data || []).map(x => `<div class="row"><div><b>${esc(x.specialty)}</b><div class="mu">Licence: ${esc(x.licence_number)}</div></div><div>${btn("doctor", x.user_id)}</div></div>`)) +
    sec("Pharmacies", (p.data || []).map(x => `<div class="row"><div><b>${esc(x.name)}</b><div class="mu">PCN: ${esc(x.pcn_licence)} · ${esc(x.address_text)}</div></div><div>${btn("pharmacy", x.id)}</div></div>`)) +
    sec("Laboratories", (l.data || []).map(x => `<div class="row"><div><b>${esc(x.name)}</b><div class="mu">MLSCN: ${esc(x.mlscn_licence)} · ${esc(x.address_text)}</div></div><div>${btn("laboratory", x.id)}</div></div>`)) +
    sec("Professional / organization verification", (v.data || []).map(x => `<div class="row"><div><div class="mu">${esc(x.notes || "")}</div>${x.document_path ? `<a href="#" data-doc="${esc(x.document_path)}">View document</a>` : ""}</div>
      <div>${btn("verif", x.user_id, `data-req="${esc(x.id)}"`)}</div></div>`));
  $("t-approvals").onclick = async e => { const t = e.target;
    if (t.dataset.doc) { e.preventDefault(); const { data, error } = await db.storage.from("private-docs").createSignedUrl(t.dataset.doc, 120); return error ? say(error.message, false) : window.open(data.signedUrl, "_blank", "noopener"); }
    if (!t.dataset.k) return; const ok = t.dataset.ok === "1";
    const kind = t.dataset.k === "verif" ? "profile" : t.dataset.k;
    if (!(await run(db.rpc("admin_set_approval", { p_kind: kind, p_id: t.dataset.id, p_approved: ok }), ok ? "Approved." : "Rejected."))) return;
    if (t.dataset.req) await db.from("verification_requests").update({ status: ok ? "approved" : "rejected" }).eq("id", t.dataset.req);
    loadApprovals(); };
}

// ---------- EARNINGS ----------
async function loadMoney() {
  const [e, q] = await Promise.all([db.rpc("admin_earnings_summary"), db.from("payouts").select("status,amount")]);
  const r = (e.data && e.data[0]) || {}; const po = q.data || [];
  const sum = s => po.filter(x => x.status === s).reduce((a, x) => a + Number(x.amount), 0);
  $("t-money").innerHTML = `<div class="grid"><div class="card"><div class="mu">Total commission earned</div><div class="stat">${naira(r.total_commission)}</div></div>
    <div class="card"><div class="mu">Pharmacy / Lab / Consultation</div><div>${naira(r.pharmacy_commission)} / ${naira(r.lab_commission)} / ${naira(r.consultation_commission)}</div></div>
    <div class="card"><div class="mu">Payouts queued</div><div class="stat">${naira(sum("queued"))}</div></div>
    <div class="card"><div class="mu">Payouts paid</div><div class="stat">${naira(sum("paid"))}</div></div></div>`;
}
boot();
</script>
</body>
</html>
